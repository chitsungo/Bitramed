<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found · Bitramed</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, "Segoe UI", system-ui, sans-serif;
        background: #faf9f6;
        color: #272521;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: inherit;
      }

      main {
        width: min(28rem, calc(100% - 2rem));
        text-align: center;
      }

      .code {
        color: #357c76;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0.75rem 0 0;
        font-size: clamp(2rem, 8vw, 3.5rem);
        letter-spacing: -0.04em;
      }

      p {
        color: #6d6962;
        line-height: 1.6;
      }

      a {
        display: inline-block;
        margin-top: 1rem;
        border: 1px solid #ddd9d2;
        border-radius: 0.65rem;
        padding: 0.7rem 1rem;
        color: inherit;
        font-size: 0.875rem;
        font-weight: 600;
        text-decoration: none;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #191816;
          color: #f0eee9;
        }

        p {
          color: #aaa59d;
        }

        a {
          border-color: #3a3834;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="code">Error 404</div>
      <h1>Page not found</h1>
      <p>The page you requested does not exist or is no longer available.</p>
      <a href="/">Return to Bitramed</a>
    </main>
  </body>
</html>
